name: Build & push Docker image (zh-CN)

# 汉化版镜像构建与发布：
#   1. 用 Dockerfile（内含 zh-cn 汉化层：i18n/apply.mjs）构建镜像
#   2. 推送到 Docker Hub（geeley/webobsidian）
#
# 触发：
#   - push 到 zh-cn 分支
#   - 打 tag（v*）——用于发布稳定版本，同时打 latest 与版本号 tag
#   - 手动（workflow_dispatch）
#
# 需要的 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   DOCKERHUB_USERNAME  —— Docker Hub 用户名（geeley）
#   DOCKERHUB_TOKEN     —— Docker Hub Access Token（切勿明文写入仓库）
# 说明：token 只存在于 GitHub Secrets，不在本文件、不在镜像、不在代码中。

on:
  push:
    branches: [zh-cn]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & push zh-CN image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/webobsidian
          tags: |
            # zh-cn 是本 fork 的主线：push 到 zh-cn 或手动触发时打 latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/zh-cn' || github.event_name == 'workflow_dispatch' }}
            type=ref,event=tag
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
